name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build production image
        run: docker build --tag adaptai-back:ci .
      - name: Deploy to Easypanel
        if: github.event_name == 'push'
        env:
          EASYPANEL_DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: >-
          curl --fail --show-error --silent --retry 3
          "$EASYPANEL_DEPLOY_WEBHOOK"
